name: JC Budgeting Server
version: "0.9.0-test"
tagline: Host a JCBudgeting database on Umbrel
description: |
  Host a shared JC Budgeting database on your Umbrel.

  What this app does:
  - Stores your JC Budgeting database on Umbrel
  - Lets desktop clients, phones, and other devices connect to the same budget
  - Gives you a built-in server page to create or select the active database

  How to use it:
  1. Install and open JC Budgeting Server on Umbrel
  2. Open the built-in /server page and create or select a database
  3. Connect your JC Budgeting clients to your Umbrel device on port 5099

  Client installs:
  https://github.com/cbrzilla/JC_Budgeting_Client

